; Otto_Sensor - Heltec Wireless Stick sensor firmware
; Ported from Arduino IDE sketch: C:\Users\Owner\Documents\Arduino\Otto_Sensor

[platformio]
default_envs = heltec_wireless_stick_v2

[env:heltec_wireless_stick_v2]
platform = espressif32
board = heltec_wireless_stick
framework = arduino

; Heltec Wireless Stick V2 (original ESP32, not V3)
; MCU: ESP32, dual-core 240 MHz
; Memory: 8 MB flash, no PSRAM
; USB identity: CP210x, VID 0x10C4, PID 0xEA60, serial number 0001
monitor_speed = 115200
monitor_port = COM8
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Verbose sensor/diagnostic logging over Serial (see src/Debug.h). Remove to silence.
build_flags =
	-DDEBUG_LOG
	-DWireless_Stick

lib_deps =
	heltecautomation/Heltec ESP32 Dev-Boards@1.1.2
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit APDS9960 Library
	bblanchon/ArduinoJson
	boschsensortec/BSEC2@1.10.2610
	boschsensortec/BME68x Sensor library@1.3.40408

[env:heltec_wireless_stick_v3]
platform = espressif32
; PlatformIO has no dedicated Wireless Stick V3 definition. The V3 uses the
; same ESP32-S3-N8 target class as the ESP32-S3-DevKitC-1.
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
	-DWIRELESS_STICK_V3
	-DWIRELESS_STICK
	-DHELTEC_BOARD=31
	-DSLOW_CLK_TPYE=1
	-DVext=36
	-DSDA_OLED=17
	-DSCL_OLED=18
	-DRST_OLED=21
	-DRST_LoRa=12
	-DDIO0=14
	-DLoRaWAN_DEBUG_LEVEL=0

; Heltec Wireless Stick V3 hardware
; MCU: ESP32-S3FN8, dual-core 240 MHz
; Memory: 8 MB QD flash, 512 KB SRAM, no PSRAM
; Wireless: 2.4 GHz Wi-Fi 802.11 b/g/n and Bluetooth 5 LE
; LoRa: SX1262, configured for the 915 MHz region in src/main.cpp
; Display: 0.49-inch 64x32 OLED
; Power: 5 V USB-C input; 3.3 V logic
; USB: CP210x USB-to-UART bridge
; USB identity: VID 0x10C4, PID 0xEA60, serial number 0001
board_upload.flash_size = 8MBchange to
board_upload.maximum_size = 8388608

monitor_speed = 115200
upload_speed = 921600

lib_deps =
	heltecautomation/Heltec ESP32 Dev-Boards@2.1.7
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit APDS9960 Library
	bblanchon/ArduinoJson
	boschsensortec/BSEC2@1.10.2610
	boschsensortec/BME68x Sensor library@1.3.40408
