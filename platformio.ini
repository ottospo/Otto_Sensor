; AWS-Otto-Sensor - Heltec Wireless Stick sensor firmware connecting to AWS IoT Core
; Derived from Otto_Sensor (MQTT broker version); uses mutual-TLS with a device
; certificate instead of MQTT username/password.
;
; Credentials live in certs/ (git-ignored) and are embedded into the firmware:
;   certs/AmazonRootCA1.pem     AWS root CA
;   certs/device.cert.pem       device certificate
;   certs/device.private.key    device private key

[platformio]
default_envs = heltec_wireless_stick_v2

[env:heltec_wireless_stick_v2]
platform = espressif32
board = heltec_wireless_stick
framework = arduino

monitor_speed = 115200
monitor_port = COM8
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

board_build.embed_txtfiles =
	certs/AmazonRootCA1.pem
	certs/device.cert.pem
	certs/device.private.key

build_flags =
	-DDEBUG_LOG
	-DWireless_Stick
	-DAWS_IOT_ENDPOINT=\"a2y7jhiel7juf2-ats.iot.us-west-2.amazonaws.com\"

lib_deps =
	heltecautomation/Heltec ESP32 Dev-Boards@1.1.2
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit APDS9960 Library
	bblanchon/ArduinoJson
	boschsensortec/BSEC2@1.10.2610
	boschsensortec/BME68x Sensor library@1.3.40408
